name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is too strict given @rolldown/binding-wasm32-wasi's
        # transitive optional deps (@emnapi/core, @emnapi/runtime) don't
        # appear in the lockfile when installed from a non-wasm32 host.
        # `npm install` on a fresh checkout is functionally equivalent and
        # tolerates that gap.
        run: npm install --no-audit --no-fund

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is too strict given @rolldown/binding-wasm32-wasi's
        # transitive optional deps (@emnapi/core, @emnapi/runtime) don't
        # appear in the lockfile when installed from a non-wasm32 host.
        # `npm install` on a fresh checkout is functionally equivalent and
        # tolerates that gap.
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8787' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is too strict given @rolldown/binding-wasm32-wasi's
        # transitive optional deps (@emnapi/core, @emnapi/runtime) don't
        # appear in the lockfile when installed from a non-wasm32 host.
        # `npm install` on a fresh checkout is functionally equivalent and
        # tolerates that gap.
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test --if-present
